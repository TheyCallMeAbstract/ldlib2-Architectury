# Fabric-specific properties
fabric_loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2
# Kotlin version: mirrors neoforge/gradle.properties. This is the stdlib embedded in the
# shipped jar (NeoForge jarJar / Fabric shadowBundle), not the compiler plugin version.
kotlin_stdlib_version=2.1.20
kotlin.jvm.target.validation.mode=ignore
# Fabric-specific: the Kotlin JVM plugin must not auto-add kotlin-stdlib:2.3.0 as a
# published dependency. The shipped shadow jar bundles kotlin-stdlib:2.1.20
# (shadowBundle below); the compile/local-runtime classpaths get the plugin's stdlib
# explicitly via compileOnly/localRuntime in fabric/build.gradle. This property is set
# here (per-project) so it does NOT disable the default dependency in :neoforge.
kotlin.stdlib.default.dependency=false
