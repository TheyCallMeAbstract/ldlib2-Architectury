# Fabric-specific properties
fabric_loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2
kotlin.jvm.target.validation.mode=ignore
# Fabric-specific: the Kotlin JVM plugin must not auto-add kotlin-stdlib as a published
# dependency (it would land in both the POM and the .module metadata); compile/local-runtime
# classpaths get it explicitly via compileOnly/localRuntime in fabric/build.gradle. Set
# per-project here so it does NOT disable the default dependency in :neoforge.
kotlin.stdlib.default.dependency=false
