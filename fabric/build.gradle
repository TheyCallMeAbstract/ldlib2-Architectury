plugins {
    id 'com.gradleup.shadow'
    // Kotlin toolchain, mirroring neoforge/build.gradle:5-6. The JVM plugin version is the
    // Kotlin compiler; the Lombok plugin version is the separate experimental Lombok plugin.
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.1.20'
    id 'io.freefair.lombok' version "9.2.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Mirror neoforge/build.gradle:52-58 and :96 so Kotlin sources can live beside Java sources
// under src/main/java, exactly as they do on NeoForge.
kotlin {
    jvmToolchain(25)
    compilerOptions {
        freeCompilerArgs.add("-Xcontext-parameters")
        freeCompilerArgs.add("-Xwhen-guards")
    }
}

sourceSets.main.kotlin { srcDir("src/main/java") }

// Fabric server gametest wiring: runGametest + verifyGametest gate.
apply from: rootProject.file('gradle/fabric-gametest.gradle')

// Fabric in-client UI test harness: -PldTest wiring plus the verifyUiTest gate.
apply from: rootProject.file('gradle/fabric-uitest.gradle')

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Dev-runtime only deps (mirrors neoforge/build.gradle:21-22). Not a mod dependency.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.isxander.dev/releases" }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '500'
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // JSR 305 annotations (@Nonnull, @ParametersAreNonnullByDefault).
    // NeoForge gets this transitively via Guava/findbugs, but Fabric needs it explicitly
    // since common is transitive:false.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // Taffy layout engine (same as NeoForge jarJar). It must be BUNDLED into the shadow jar,
    // not published as a Maven runtime dependency: taffy ships no fabric.mod.json, so Fabric
    // Loader cannot declare or resolve it, and a jar dropped into mods/ has no POM resolution
    // at all. Shipping it transitively-only caused NoClassDefFoundError: TaffyDisplay for
    // every non-Gradle consumer. Modelled on the kotlin-stdlib block below: shadowBundle embeds
    // the classes, compileOnly/localRuntime keep it on the compile and dev-runtime classpaths
    // without adding it back to the published POM/.module metadata.
    // transitive = false is load-bearing: taffy declares it.unimi.dsi:fastutil:8.5.12 at runtime,
    // and shadow resolves transitives. Bundling fastutil would add ~12.8k classes (~23 MB) and
    // shadow Minecraft's own fastutil 8.5.18 with an older copy. Minecraft already provides
    // fastutil on the classpath, so taffy's transitive must be excluded from the shaded set.
    shadowBundle("dev.vfyjxf:taffy:$rootProject.taffy_version") { transitive = false }
    compileOnly "dev.vfyjxf:taffy:$rootProject.taffy_version"
    localRuntime "dev.vfyjxf:taffy:$rootProject.taffy_version"

    // kotlin-stdlib: NeoForge ships it via jarJar at kotlin_stdlib_version (neoforge/build.gradle:107-109,
    // embedded as META-INF/jarjar/kotlin-stdlib-2.1.20.jar). Shadow is Fabric's analogue here, so the
    // stdlib is listed explicitly in shadowBundle to land inside the Fabric jar. The Kotlin plugin still
    // puts its own (2.3.0) stdlib on the compile classpath, preserving NeoForge's version split.
    shadowBundle "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_stdlib_version"

    // The Kotlin JVM plugin's automatic kotlin-stdlib dependency is disabled for :fabric via
    // fabric/gradle.properties (kotlin.stdlib.default.dependency=false): otherwise it is added
    // to the `api` configuration and published in both the POM and the .module metadata as
    // kotlin-stdlib:2.3.0, while the shipped shadow jar already bundles 2.1.20 above. Re-add it
    // on the compile and local-runtime classpaths only — compileOnly/localRuntime are never
    // published, so compilation and dev/test runtime keep working.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}"
    localRuntime "org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}"

    // YACL — config library for Fabric (replaces NeoForge ModConfigSpec)
    implementation "dev.isxander:yet-another-config-lib:$rootProject.yacl_version"
    compileOnly("dev.isxander:yet-another-config-lib:$rootProject.yacl_version")

    // JEI — common API is shared across platforms, fabric-api is Fabric-specific
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}") { transitive = false }
    // JEI dev runtime so the integration actually loads in runClient (optional mod; never `depends`).
    localRuntime("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // JUnit + Mockito (mirrors neoforge/build.gradle:121-126). fabric-loader-junit bootstraps
    // Fabric Loader (and thus the Minecraft classpath) inside the plain `test` task.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
}

// Make test classpath inherit from main classpath (mirrors neoforge/build.gradle:88-93).
// Loom supplies the Minecraft/loader classpath to `src/test` for free, but the `common`
// configuration is attached to `compileClasspath` directly and would otherwise be missing.
configurations {
    testImplementation.extendsFrom(implementation)
    testCompileOnly.extendsFrom(compileClasspath)
    testRuntimeOnly.extendsFrom(runtimeClasspath)
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
//
// The `dev` jar embeds the same shadowBundle set as shadowJar. Left unbundled it contains no
// kotlin/, no dev/vfyjxf/ (taffy) and no :common, so a launcher or script that picks up
// *-dev.jar dies on launch with NoClassDefFoundError. Bundling both removes that trap: either
// file produced by `assemble` boots standalone.
jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // `collect{}` flattens the configuration into a plain List<File>, which discards the task
    // dependency metadata Gradle uses to order producers. Without this explicit dependsOn,
    // :fabric:jar consumes :common:transformProductionFabric's jar before it has been built
    // (Gradle 9 rejects that as an implicit-dependency configuration problem).
    dependsOn configurations.shadowBundle
    from {
        configurations.shadowBundle.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
